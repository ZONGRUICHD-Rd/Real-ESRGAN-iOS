name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: Convert models (PyTorch → Core ML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Core ML packages
        id: cache
        uses: actions/cache@v4
        with:
          path: build/mlpackages
          key: mlpackages-${{ hashFiles('tools/convert_models.py', 'tools/requirements.txt') }}

      - name: Cache PyTorch weights
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: weights
          key: weights-v1

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Install conversion dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Download weights and convert
        if: steps.cache.outputs.cache-hit != 'true'
        run: SKIP_COMPILE=1 tools/build_models.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mlpackages
          path: build/mlpackages
          retention-days: 7

  ios:
    name: Build unsigned IPA (Xcode 26)
    needs: models
    runs-on: macos-26
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mlpackages
          path: build/mlpackages

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Compile Core ML models
        run: |
          mkdir -p build/Models
          for package in build/mlpackages/*.mlpackage; do
            xcrun coremlcompiler compile "$package" build/Models
          done
          du -sh build/Models/*

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          VERSION="${TAG#v}"
          [ -n "$VERSION" ] || VERSION="1.0.0"
          set -o pipefail
          xcodebuild \
            -project RealESRGAN.xcodeproj \
            -scheme RealESRGAN \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/RealESRGAN.app
          test -d "$APP"
          ls "$APP/Models"
          plutil -p "$APP/Info.plist" | grep -E -A3 "BGTaskSchedulerPermittedIdentifiers|NSSupportsLiveActivities|UIBackgroundModes"
          test -d "$APP/PlugIns/RealESRGANWidgets.appex"
          plutil -p "$APP/PlugIns/RealESRGANWidgets.appex/Info.plist" | grep -A2 NSExtension
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../RealESRGAN-unsigned.ipa Payload)
          ls -lh build/RealESRGAN-unsigned.ipa
          shasum -a 256 build/RealESRGAN-unsigned.ipa | tee build/RealESRGAN-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RealESRGAN-unsigned-ipa
          path: |
            build/RealESRGAN-unsigned.ipa
            build/RealESRGAN-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log

      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Real-ESRGAN iOS ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: |
            build/RealESRGAN-unsigned.ipa
            build/RealESRGAN-unsigned.ipa.sha256

  simulator-preview:
    name: Simulator screenshots (Dynamic Island)
    needs: models
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mlpackages
          path: build/mlpackages

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Compile models and generate project
        run: |
          mkdir -p build/Models
          for package in build/mlpackages/*.mlpackage; do
            xcrun coremlcompiler compile "$package" build/Models
          done
          brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project RealESRGAN.xcodeproj \
            -scheme RealESRGAN \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild-sim.log

      - name: Run in simulator and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          found = [(rt, d) for rt, ds in devices.items() if 'iOS-26' in rt for d in ds
                   if d['name'].startswith('iPhone') and 'Pro' in d['name'] and 'Max' not in d['name']]
          found.sort(key=lambda t: (t[0], t[1]['name']))
          print(found[-1][1]['udid'])
          ")
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=build/SimData/Build/Products/Debug-iphonesimulator/RealESRGAN.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p build/shots
          xcrun simctl launch "$UDID" com.zongruichd.realesrgan -LiveActivityDemo
          sleep 10
          xcrun simctl io "$UDID" screenshot build/shots/1-app.png
          # Send the app to the background so the Live Activity moves into the Dynamic Island.
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 6
          xcrun simctl io "$UDID" screenshot build/shots/2-island.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process CONTAINS "RealESRGANWidgets" OR (process == "chronod") OR (subsystem == "com.apple.activitykit")' \
            > build/shots/live-activity.log 2>&1 || true
          tail -40 build/shots/live-activity.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: build/shots
